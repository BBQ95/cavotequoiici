name: Mobile release (EAS Build → Play Store, piste interne)

# Release de l'app Android : tag v* → EAS Build (profil production) →
# EAS Submit vers la piste interne de la Play Console. La promotion vers le
# test fermé puis la production reste un clic humain dans la console.
#
# Déclenchement par TAG uniquement : poser un tag de version est un acte
# humain délibéré, même philosophie que le dispatch manuel de data-release.
# Traçabilité AGPL : chaque version en circulation = un tag Git = une release
# store (pas d'OTA, pas de channel EAS Update — décision de juillet 2026).
#
# Prérequis (une seule fois) :
#   - secret de dépôt EXPO_TOKEN (expo.dev → Access tokens) ;
#   - clé de service Google Play liée au projet EAS via `eas credentials`
#     (stockée chez Expo, jamais dans le dépôt) — sans elle, le step Submit
#     échoue. Ne pas pousser de tag avant cette liaison.

on:
  push:
    tags: ["v*"]

# Pas de push ni d'API GitHub ici : permissions minimales.
permissions:
  contents: read

# Jamais deux releases en parallèle, et jamais annuler une release en cours
# (le compteur remote versionCode est incrémenté au lancement de chaque build).
concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  release:
    name: EAS Build + Submit (Android, production)
    runs-on: ubuntu-latest
    # Le job attend la fin du build EAS (file d'attente du plan gratuit
    # comprise) : marge large.
    timeout-minutes: 120
    defaults:
      run:
        working-directory: mobile
    steps:
      # Échec précoce (< 10 s) si le secret manque : ce workflow n'est lancé
      # que par un tag humain délibéré — pas de skip silencieux.
      - name: Vérifier le secret EXPO_TOKEN
        working-directory: .
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Secret de dépôt EXPO_TOKEN manquant (expo.dev → Access tokens)"
            exit 1
          fi

      - uses: actions/checkout@v4

      # Le versionCode est tenu par EAS (compteur remote, autoIncrement) mais
      # le nom de version affiché vient d'app.json : un tag v1.1.0 posé sur un
      # app.json resté en 1.0.0 sortirait une release mal étiquetée.
      - name: Vérifier la cohérence tag ↔ expo.version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python3 -c "import json; print(json.load(open('app.json'))['expo']['version'])")
          if [ "$tag" != "$version" ]; then
            echo "::error::Le tag v${tag} ne correspond pas à expo.version (${version}) dans mobile/app.json"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci

      # Filet de sécurité : un tag peut viser un commit plus ancien que le
      # dernier passage de ci.yml (mêmes vérifications que le job mobile).
      - name: Typecheck + tests Node
        run: |
          npx tsc --noEmit
          npm test

      # Keystore/upload key : gérés par EAS (générés au premier build).
      # EXPO_PUBLIC_DATA_URL est embarquée par le profil production d'eas.json.
      # On ATTEND la fin du build : son résultat conditionne le submit et la
      # notification.
      - name: EAS Build (profil production, .aab)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli build --platform android --profile production --non-interactive

      # Piste `internal` (bornée dans eas.json). Exige la clé de service
      # Google Play liée via `eas credentials` (cf. en-tête).
      - name: EAS Submit (piste interne)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli submit --platform android --latest --non-interactive

  notify:
    name: Notifier Boss (webhook Hermès)
    needs: [release]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      # Une variable/secret absent vaut '' dans les expressions : le POST est
      # sauté si le secret HMAC ou l'URL (variable de dépôt) manque — un fork
      # sans configuration Hermès passe sans bruit.
      HAS_WEBHOOK: ${{ secrets.HERMES_WEBHOOK_SECRET != '' && vars.HERMES_WEBHOOK_URL != '' }}
    steps:
      - name: POST signé vers le webhook build-status
        if: ${{ env.HAS_WEBHOOK == 'true' }}
        env:
          HERMES_WEBHOOK_SECRET: ${{ secrets.HERMES_WEBHOOK_SECRET }}
          HERMES_WEBHOOK_URL: ${{ vars.HERMES_WEBHOOK_URL }}
          STATUT: ${{ needs.release.result == 'success' && 'success' || 'failure' }}
          REPO: ${{ github.repository }}
          BRANCHE: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY=$(printf '{"status":"%s","repo":"%s","branch":"%s","sha":"%s","run_url":"%s"}' \
            "$STATUT" "$REPO" "$BRANCHE" "$SHA" "$RUN_URL")
          SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$HERMES_WEBHOOK_SECRET" | sed 's/^.* //')
          curl -s -X POST "$HERMES_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Signature: $SIG" \
            --data "$BODY"
