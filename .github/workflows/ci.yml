name: CI

# Garde-fou rapide et déterministe sur chaque PR (et sur push vers main).
# Aucune donnée réelle n'est téléchargée ici : la validation « repères »
# (Saint-Denis rouge, Nice marine), qui exige le pipeline complet, vit dans
# integration.yml (nocturne / manuel).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-unit:
    name: Tests unitaires Python (sans BDD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Sans DATABASE_URL, les tests d'intégration BDD (test_reperes,
      # test_api_communes, test_api_scrutins) skippent proprement.
      - name: pytest
        run: python -m pytest -q

  migrations:
    name: Migrations Alembic sur base neuve
    runs-on: ubuntu-latest
    services:
      postgres:
        # Image PostGIS obligatoire : la migration 0001 fait CREATE EXTENSION postgis.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: cavote
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:cavote@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: alembic upgrade head
        run: python -m alembic upgrade head

  openapi-types:
    name: Types TS à jour avec le schéma API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      # Régénère openapi.json (introspection Pydantic, pas de BDD) puis les types.
      # Version openapi-typescript épinglée pour un rendu reproductible.
      - name: Régénère les types TS
        run: |
          python -m api.openapi_export openapi.json
          npx --yes openapi-typescript@7.13.0 openapi.json -o mobile/src/api/types.ts
      - name: Échoue si mobile/src/api/types.ts a dérivé (make types oublié)
        run: git diff --exit-code mobile/src/api/types.ts

  mobile:
    name: Mobile — typecheck + export web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Typecheck strict
        run: npx tsc --noEmit
      - name: Tests Node (parité recherche locale)
        run: npm test
      - name: Export web (valide le bundle Metro sans device)
        run: npx expo export --platform web

  docker-api:
    name: Image API — build + smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Valide le Dockerfile et l'installation de requirements-api.txt.
      - name: Build de l'image API
        run: docker build -t cavote-api:ci .
      # /healthz ne touche pas la base : pas besoin de PostGIS ici. Mais uvicorn
      # importe api.main (et donc tous les routeurs) au démarrage — si un import
      # de l'API tire une dépendance absente de requirements-api.txt, le conteneur
      # ne démarre pas et /healthz ne répond jamais. Ce smoke-test attrape donc la
      # dérive requirements-api.txt ↔ requirements.txt (remarque de revue #30).
      - name: Démarre le conteneur
        run: docker run -d --name cavote-api-ci -p 8200:8200 cavote-api:ci
      - name: Smoke-test /healthz
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8200/healthz || true)
            if [ "$code" = "200" ]; then echo "healthz OK"; exit 0; fi
            sleep 1
          done
          echo "::error::/healthz n'a pas répondu 200 — l'API n'a pas démarré (dépendance manquante dans requirements-api.txt ?)"
          docker logs cavote-api-ci
          exit 1
      # Les glyphes des étiquettes de la carte doivent voyager dans l'image
      # (attrape un .dockerignore qui exclurait les .pbf ou un mount cassé).
      - name: Smoke-test /fonts (glyphes carte)
        run: curl -sf -o /dev/null "http://localhost:8200/fonts/Noto%20Sans%20Medium/0-255.pbf"
      - name: Logs du conteneur (toujours)
        if: ${{ always() }}
        run: docker logs cavote-api-ci || true

  notify:
    name: Notifier Boss (webhook Hermès)
    needs: [python-unit, migrations, openapi-types, mobile, docker-api]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      # Une variable/secret absent vaut '' dans les expressions : le POST est
      # sauté si le secret HMAC ou l'URL (variable de dépôt) manque — un fork
      # sans configuration Hermès passe sans bruit.
      HAS_WEBHOOK: ${{ secrets.HERMES_WEBHOOK_SECRET != '' && vars.HERMES_WEBHOOK_URL != '' }}
    steps:
      # POST signé HMAC vers l'adaptateur webhook Hermès → Boss annonce dans
      # Telegram et délègue à Richard si échec (runbook « Notifications de
      # build → Boss »).
      - name: POST signé vers le webhook build-status
        if: ${{ env.HAS_WEBHOOK == 'true' }}
        env:
          HERMES_WEBHOOK_SECRET: ${{ secrets.HERMES_WEBHOOK_SECRET }}
          HERMES_WEBHOOK_URL: ${{ vars.HERMES_WEBHOOK_URL }}
          # Statut agrégé des 4 jobs requis (failure si l'un échoue/annulé).
          STATUT: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failure' || 'success' }}
          REPO: ${{ github.repository }}
          BRANCHE: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY=$(printf '{"status":"%s","repo":"%s","branch":"%s","sha":"%s","run_url":"%s"}' \
            "$STATUT" "$REPO" "$BRANCHE" "$SHA" "$RUN_URL")
          SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$HERMES_WEBHOOK_SECRET" | sed 's/^.* //')
          curl -s -X POST "$HERMES_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Signature: $SIG" \
            --data "$BODY"
