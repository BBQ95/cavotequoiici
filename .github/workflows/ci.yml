name: CI

# Garde-fou rapide et déterministe sur chaque PR (et sur push vers main).
# Aucune donnée réelle n'est téléchargée ici : la validation « repères »
# (Saint-Denis rouge, Nice marine), qui exige le pipeline complet, vit dans
# integration.yml (nocturne / manuel).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-unit:
    name: Tests unitaires Python (sans BDD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Sans DATABASE_URL, les tests d'intégration BDD (test_reperes…)
      # skippent proprement.
      - name: pytest
        run: python -m pytest -q

  migrations:
    name: Migrations Alembic sur base neuve
    runs-on: ubuntu-latest
    services:
      postgres:
        # Image PostGIS obligatoire : la migration 0001 fait CREATE EXTENSION postgis.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: cavote
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:cavote@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: alembic upgrade head
        run: python -m alembic upgrade head

  mobile:
    name: Mobile — typecheck + export web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Typecheck strict
        run: npx tsc --noEmit
      - name: Tests Node (parité recherche locale)
        run: npm test
      - name: Export web (valide le bundle Metro sans device)
        run: npx expo export --platform web

  notify:
    name: Notifier Boss (webhook Hermès)
    needs: [python-unit, migrations, mobile]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      # Une variable/secret absent vaut '' dans les expressions : le POST est
      # sauté si le secret HMAC ou l'URL (variable de dépôt) manque — un fork
      # sans configuration Hermès passe sans bruit.
      HAS_WEBHOOK: ${{ secrets.HERMES_WEBHOOK_SECRET != '' && vars.HERMES_WEBHOOK_URL != '' }}
    steps:
      # POST signé HMAC vers l'adaptateur webhook Hermès → Boss annonce dans
      # Telegram et délègue à Richard si échec (runbook « Notifications de
      # build → Boss »).
      - name: POST signé vers le webhook build-status
        if: ${{ env.HAS_WEBHOOK == 'true' }}
        env:
          HERMES_WEBHOOK_SECRET: ${{ secrets.HERMES_WEBHOOK_SECRET }}
          HERMES_WEBHOOK_URL: ${{ vars.HERMES_WEBHOOK_URL }}
          # Statut agrégé des 3 jobs requis (failure si l'un échoue/annulé).
          STATUT: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failure' || 'success' }}
          REPO: ${{ github.repository }}
          BRANCHE: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY=$(printf '{"status":"%s","repo":"%s","branch":"%s","sha":"%s","run_url":"%s"}' \
            "$STATUT" "$REPO" "$BRANCHE" "$SHA" "$RUN_URL")
          SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$HERMES_WEBHOOK_SECRET" | sed 's/^.* //')
          curl -s -X POST "$HERMES_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Signature: $SIG" \
            --data "$BODY"
