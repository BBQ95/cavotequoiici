# Paramètres du modèle de synthèse de la couleur politique.
# Méthodologie complète : docs/methodologie.md.
# Ces choix méthodologiques sont assumés, publics et discutables (dépôt AGPL v3).

# Demi-vie de la décroissance exponentielle du poids de récence (≈ un cycle électoral).
# poids_recence = 0.5 ** (age_en_annees / demi_vie_ans)
demi_vie_ans: 6

# Plancher de désaturation par l'abstention :
# facteur_participation = clamp(participation_commune / participation_mediane_nationale, plancher, 1.0)
plancher_desaturation: 0.55

# Poids par TYPE de scrutin (le poids effectif = poids_brut × poids_recence).
# Les seconds tours sont EXCLUS (poids 0) : ils mesurent un report, pas une préférence.
poids_type:
  presidentielle_t1: 1.0
  legislatives_t1: 0.8
  europeennes: 0.7
  regionales_t1: 0.6
  departementales_t1: 0.6
  municipales_t1: 0.5

# Panier de scrutins du MVP.
scrutins:
  - id: presidentielle_2022_t1
    type: presidentielle_t1
    tour: 1
    date: 2022-04-10
    poids_brut: 1.0
  - id: legislatives_2024_t1
    type: legislatives_t1
    tour: 1
    date: 2024-06-30
    poids_brut: 0.8
  - id: europeennes_2024
    type: europeennes
    tour: 1
    date: 2024-06-09
    poids_brut: 0.7
  - id: municipales_2026_t1
    type: municipales_t1
    tour: 1
    date: 2026-03-15
    poids_brut: 0.5
